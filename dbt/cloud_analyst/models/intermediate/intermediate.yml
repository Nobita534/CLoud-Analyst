version: 2
models:
  - name: int_customer
    description: >
      Prepare customer data for downstream models.
    columns:
      - name: customer_id
        description: >
          Unique ID of the customer record.
      - name: customer_unique_id
        description: >
          Unique ID that identifies the actual customer across different orders.
      - name: customer_state
        description: >
          State where the customer is located.
  - name: int_orders
    description: >
      Prepare order data for downstream models
    columns:
      - name: order_id
        description: >
          Unique ID of the order.
      - name: customer_id
        description: >
          Unique ID of the customer record.
      - name: order_purchase_timestamp
        description: >
          Date and time when the order was placed.
      - name: order_approved_at
        description: >
          Date and time when the order payment was approved.
      - name: order_status
        description: >
          Current status of the order.
  - name: int_geolocation
    description: >
      Prepare geolocation data for downstream models
    columns:
      - name: geolocation_zip_code_prefix
        description: >
          First five digits of the ZIP code.
      - name: geolocation_lat
        description: >
          Latitude of the ZIP code location.
      - name: geolocation_lng
        description: >
          Longitude of the ZIP code location.
  - name: int_order_items
    description: >
      Prepare order items data for downstream models
    columns:
      - name: order_item_id
        description: >
          Sequential number of the item within the order.
      - name: order_id
        description: >
          ID of the order containing the item.
      - name: product_id
        description: >
          ID of the product.
      - name: seller_id
        description: >
          ID of the seller who sold the product.
      - name: price
        description: >
          Price of the product.
      - name: freight_value
        description: >
          Freight cost of the item.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_item_id
              - order_id
  - name: int_order_payments
    description: >
      Prepare order payments data for downstream models
    columns:
      - name: payment_sequential
        description: >
          Sequence number of the payment for the order.
      - name: order_id
        description: >
          ID of the order containing the item.
      - name: payment_type
        description: >
          Payment method used for the order.
      - name: payment_value
        description: >
          Amount paid for the order.
  - name: int_order_reviews
    description: >
      Prepare order reviews data for downstream models
    columns:
      - name: review_id
        description: >
          Unique ID of the review.
      - name: order_id
        description: >
          ID of the order containing the item.
      - name: review_score
        description: >
          Customer rating from 1 to 5.
      - name: review_comment_message
        description: >
          Message written by the customer.
  - name: int_products
    description: >
      Prepare product data for downstream models
    columns:
      - name: product_id
        description: >
          Unique ID of the product.
      - name: product_category_name
        description: >
          Category name of the product.
  - name: int_seller
    description: >
      Prepare seller data for downstream models
    columns:
      - name: seller_id
        description: >
          Unique ID of the seller.
      - name: seller_zip_code_prefix
        description: >
          First five digits of the seller's ZIP code
      - name: seller_state
        description: >
          State where the seller is located.
  - name: int_product_category_name_translation
    description:
      Prepare translation product name data for downstream models