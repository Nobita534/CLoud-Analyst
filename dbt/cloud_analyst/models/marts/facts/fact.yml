version: 2

models:

  - name: fact_order_items
    description: >
      Fact table containing product items included in each order.
    columns:
      - name: fact_item_id
        description: Unique identifier for each order item fact.
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: ID of the order containing the item.
        data_tests:
          - not_null

      - name: product_id
        description: ID of the product included in the order.
        data_tests:
          - not_null

      - name: seller_id
        description: ID of the seller who sold the product.
        data_tests:
          - not_null

      - name: price
        description: Price of the product item.

      - name: freight_value
        description: Freight cost of the item.


  - name: fact_order_payments
    description: >
      Fact table containing payment information for each order.
    columns:
      - name: fact_payment_id
        description: Unique identifier for each payment fact.
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: ID of the order associated with the payment.
        data_tests:
          - not_null

      - name: payment_type
        description: Payment method used for the order.

      - name: payment_installments
        description: Number of installments used for the payment.

      - name: payment_value
        description: Amount paid for the order.


  - name: fact_review
    description: >
      Fact table containing customer reviews and ratings for orders.
    columns:
      - name: review_id
        description: Unique ID of the review.
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: ID of the order associated with the review.
        data_tests:
          - not_null

      - name: review_comment_title
        description: Title of the customer's review.

      - name: review_comment_message
        description: Message written by the customer.

      - name: review_score
        description: Customer rating from 1 to 5.


  - name: fact_customer_rfm
    description: >
      Fact table containing customer RFM metrics for customer behavior analysis.
    columns:
      - name: customer_rfm_id
        description: Unique identifier for each RFM record.
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: Unique ID that identifies the actual customer.
        data_tests:
          - not_null

      - name: analysis date
        description: Date when the RFM metrics were calculated.
        data_tests:
          - not_null

      - name: frequency
        description: Number of orders made by the customer.

      - name: monetary
        description: Total monetary value generated by the customer.

      - name: recency
        description: Number of days since the customer's most recent order.