version: 2

models:

  - name: customer_metrics
    description: >
      Standardized customer-level metrics used for customer segmentation,
      customer retention analysis, and RFM analysis.

    columns:

      - name: customer_unique_id
        description: >
          Unique identifier representing the actual customer across
          different orders.
        data_tests:
          - not_null

      - name: analysis_date_key
        description: >
          Snapshot date key used as the reference date for calculating
          customer-level metrics.
        data_tests:
          - not_null

      - name: purchase_frequency
        description: >
          Number of distinct completed orders placed by the customer
          within the 12-month period preceding the snapshot date.

      - name: monetary
        description: >
          Total payment value generated by the customer from successfully
          completed orders within the 12-month period preceding the
          snapshot date.

      - name: recency
        description: >
          Number of days between the snapshot date and the customer's
          most recent completed purchase within the 12-month period
          preceding the snapshot date.


  - name: revenue_metrics
    description: >
      Standardized revenue metrics used to monitor overall sales
      performance.

    columns:

      - name: total_revenue
        description: >
          Total payment value generated from successfully completed
          orders within the selected analysis period.


  - name: order_metrics
    description: >
      Standardized order and customer activity metrics used to monitor
      overall order performance.

    columns:

      - name: customer_count
        description: >
          Number of unique customers with at least one successfully
          completed order within the selected analysis period.

      - name: total_orders
        description: >
          Number of distinct successfully completed orders within the
          selected analysis period.


  - name: payment_metrics
    description: >
      Standardized payment metrics used to analyze payment behavior
      within successfully completed orders.

    columns:

      - name: voucher_usage_rate
        description: >
          Percentage of completed orders that used at least one
          voucher payment.


  - name: product_metrics
    description: >
      Standardized product and product-category metrics used to analyze
      sales performance across geographic locations.

    columns:

      - name: product_category_name
        description: >
          Product category associated with the metric.

      - name: customer_state
        description: >
          Brazilian state associated with the customer location used
          for geographic sales analysis.

      - name: total_revenue
        description: >
          Total revenue generated from successfully completed orders
          associated with the product category within the selected
          analysis period.

      - name: total_orders
        description: >
          Number of distinct successfully completed orders associated
          with the product category within the selected analysis period.


  - name: seller_metrics
    description: >
      Standardized seller performance metrics used to evaluate seller
      business performance and customer experience.

    columns:

      - name: seller_id
        description: >
          Unique identifier of the seller.
        data_tests:
          - not_null

      - name: seller_state
        description: >
          Brazilian state where the seller is located.

      - name: total_revenue
        description: >
          Total revenue generated by the seller from successfully
          completed orders within the selected analysis period.

      - name: total_orders
        description: >
          Number of distinct successfully completed orders associated
          with the seller within the selected analysis period.

      - name: average_review_score
        description: >
          Average customer review score associated with successfully
          completed orders handled by the seller.