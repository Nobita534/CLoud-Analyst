version: 2

models:

  - name: customer_metrics
    description: >
      Customer-level RFM metrics and segmentation calculated separately
      for each analysis snapshot.

    columns:
      - name: customer_unique_id
        description: >
          Unique identifier representing the actual customer across orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id

      - name: analysis_date_key
        description: Snapshot date used for RFM calculation.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: frequency
        description: >
          Number of delivered orders within the trailing analysis window.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"

      - name: monetary
        description: >
          Observed payment value from delivered orders within the window.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: recency
        description: >
          Days between the snapshot and the latest delivered order.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= 366"

      - name: r_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: f_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= LEAST(frequency, 5)"

      - name: m_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: rfm_score
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= r_score + f_score + m_score"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3
                max_value: 15
                inclusive: true

      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - VIP
                  - Active Repeat Customer
                  - Potential Loyalist
                  - At Risk
                  - Others
                  - Recent One-time Customer
                  - High-Value Lapsed Customer

  - name: revenue_metrics
    description: >
      Standardized revenue metrics used to monitor overall sales
      performance.

    columns:
      - name: total_revenue
        description: >
          Total payment value generated from successfully completed
          orders within the selected analysis period.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"
      - name: order_purchase_date_key
        description: Purchase date used to attribute delivered-order revenue.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: customer_unique_id
        data_tests:
          - not_null

      - name: voucher_payment_value
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= total_revenue"

      - name: used_voucher
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: product_metrics
    description: >
      Standardized product and product-category metrics used to analyze
      sales performance across geographic locations.

    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('dim_products')
                field: product_id

      - name: total_product_sales
        description: >
          Total sales of products sold through successfully completed orders.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"

      - name: total_freight_value
        description: >
          Total freight value associated with successfully completed orders.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"

      - name: total_orders
        description: >
          Number of distinct successfully completed orders associated
          with the product category within the selected analysis period.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"
      - name: total_items_sold
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"

      - name: order_purchase_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_state
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - product_id
              - customer_state
              - order_purchase_date_key
      - dbt_utils.expression_is_true:
          arguments: 
            expression: "total_items_sold >= total_orders"


  - name: seller_metrics
    description: >
      Standardized seller performance metrics used to evaluate seller
      business performance and customer experience.

    columns:

      - name: seller_id
        description: >
          Unique identifier of the seller.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: 
                to: ref('dim_sellers')
                field: seller_id


      - name: seller_state
        description: >
          Brazilian state where the seller is located.
        data_tests:
          - not_null

      - name: total_sales
        description: >
          Total sales generated by the seller from successfully
          completed orders within the selected analysis period.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"

      - name: average_review_score
        description: >
          Average customer review score associated with successfully
          completed orders handled by the seller.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      
      - name: review_coverage_rate
        description: >
          The rate between order having review and total delivered orders
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

      - name: on_time_delivery_rate
        description: >
          Actual delivery not later than estimated delivery date
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

      - name: average_delivery_days
        description: >
          Days from purchase to customer delivery
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "reviewed_orders <= total_orders"

