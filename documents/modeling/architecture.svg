<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title desc">
  <title id="title">Olist analytics architecture</title>
  <desc id="desc">Read left to right across the top row, then right to left across the bottom row. Olist source data flows through Azure Data Factory ingestion, ADLS Gen2 storage, Azure Data Factory loading, PostgreSQL source data, dbt standardization and modeling, PostgreSQL analytical data, and Power BI.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#318577"/>
    </marker>
  </defs>
  <rect width="960" height="414" rx="16" fill="#edf7f2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" font-size="24" font-weight="700" fill="#20564c">Olist analytics architecture</text>
    <text x="36" y="64" font-size="13" fill="#52776d">Ingestion, storage, transformation, and reporting</text>
  <g transform="translate(36 84)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">01 / SOURCE</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">Olist source data</text>
    
  </g>
  <g transform="translate(264 84)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">02 / INGESTION</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">Azure Data Factory</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Data ingestion</text>
  </g>
  <g transform="translate(492 84)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">03 / STORAGE</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">ADLS Gen2</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Cloud storage</text>
  </g>
  <g transform="translate(720 84)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">04 / LOADING</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">Azure Data Factory</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Data loading</text>
  </g>
  <g transform="translate(720 270)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">05 / WAREHOUSE INPUT</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">PostgreSQL</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Source data</text>
  </g>
  <g transform="translate(492 270)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">06 / TRANSFORMATION</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">dbt Core</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Standardization</text>
    <text x="16" y="90" font-size="14" fill="#3b5a52">and modeling</text>
  </g>
  <g transform="translate(264 270)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">07 / WAREHOUSE OUTPUT</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">PostgreSQL</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Analytical data</text>
  </g>
  <g transform="translate(36 270)">
    <rect width="208" height="108" rx="12" fill="#ffffff" stroke="#b4d9cb" stroke-width="1.5"/>
    <text x="16" y="23" font-size="10" font-weight="700" fill="#52776d">08 / REPORTING</text>
    <text x="16" y="49" font-size="18" font-weight="700" fill="#20564c">Power BI</text>
    <text x="16" y="73" font-size="14" fill="#3b5a52">Semantic model</text>
    <text x="16" y="90" font-size="14" fill="#3b5a52">and dashboard</text>
  </g>
  </g>
  <g fill="none" stroke="#318577" stroke-width="2" marker-end="url(#arrow)">
    <path d="M245 138 H260"/>
    <path d="M473 138 H488"/>
    <path d="M701 138 H716"/>
    <path d="M824 194 V266"/>
    <path d="M718 324 H705"/>
    <path d="M490 324 H477"/>
    <path d="M262 324 H249"/>
  </g>
</svg>
